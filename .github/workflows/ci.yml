name: ci

# Build and test on Linux and macOS for every push to main and every pull request into it.
# Windows is not covered here; the release workflow builds it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, checked with: git ls-remote --tags https://github.com/actions/checkout
        with:
          persist-credentials: false

      # The runner image ships rustup with a stable toolchain; no third-party toolchain action is needed.
      - name: Show Rust toolchain
        run: |
          rustup show
          cargo --version

      - name: Build Rust workspace
        working-directory: rust
        run: cargo build --workspace --locked

      - name: Test Rust workspace
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Test Python edition
        working-directory: python
        run: python3 -m unittest discover -s tests -v
