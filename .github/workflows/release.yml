name: release

# On a v* tag, build each platform's binary and attach it to the release,
# where the plugin's installers (rust/herdr/install.sh, rust/herdr/install.ps1) download it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read # the default; jobs that publish to the release ask for write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0, checked with: git ls-remote --tags https://github.com/actions/checkout
        with:
          persist-credentials: false
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "herdr-talk $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0, checked with: git ls-remote --tags https://github.com/actions/checkout
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: herdr-talk
          manifest-path: rust/Cargo.toml
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          zip: windows
          checksum: sha256
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Sign the checksum files, which the installers verify before trusting the archives.
  # Needs the MINISIGN_SECRET_KEY and MINISIGN_PASSWORD secrets (the key from `minisign -G`).
  # The secrets live in the `release` environment, so only this job can read them.
  sign:
    needs: binaries
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    # Without the key, signing is skipped and the job succeeds, so publish still runs. With the key, a failed signature fails the job.
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Skip signing (no MINISIGN_SECRET_KEY)
        if: env.MINISIGN_SECRET_KEY == ''
        run: echo "::warning::MINISIGN_SECRET_KEY is not set in the release environment; the checksums are not signed."
      - name: Sign checksums
        if: env.MINISIGN_SECRET_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sign"
          mkdir -p "$work" && cd "$work"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > secret.key && chmod 600 secret.key
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256'
          for f in *.sha256; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -q -s secret.key -m "$f" -x "$f.minisig"
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*.sha256.minisig

  # Publish last: a failed target leaves a draft, never a release that installs 404.
  publish:
    needs: [binaries, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
