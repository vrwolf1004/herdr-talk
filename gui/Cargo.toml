[package]
name = "herdr-talk-gui"
version = "0.1.0"
edition = "2021"
description = "Windows window for herdr-talk: shows the chat and sends messages through the local control channel"

[dependencies]
eframe = "0.31"
serde_json = "1"
talk-core = { path = "../rust/crates/talk-core" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
