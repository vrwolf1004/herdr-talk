[package]
name = "talk-core"
version.workspace = true
edition.workspace = true
description = "Peer discovery, messages and chat commands shared by herdr-talk front ends"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
fastrand = "2"
getrandom = "0.2"
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
socket2 = "0.5"
sys-locale = "0.3"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
unicode-width = "0.2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
